<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEB-WEBTHEREMINE-ÉCART</title>
  <style>
    :root {
      --bg: #0a0a10; --panel: #12121c; --accent: #00e87a;
      --dim: #333; --text: #bbb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Courier New', monospace;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; gap: 6px; padding: 8px;
    }
    h1 {
      color: var(--accent); font-size: 1em;
      letter-spacing: .35em; text-transform: uppercase; padding: 6px 0;
    }
    #video-wrap { position: relative; line-height: 0; border: 1px solid #1a1a2a; width: 100%; max-width: 640px; }
    #videoel { display: none; }
    #overlay { display: block; cursor: crosshair; width: 100%; height: auto; touch-action: none; }
    .panel {
      background: var(--panel); border: 1px solid #1e1e30;
      border-radius: 4px; padding: 7px 12px;
      display: flex; flex-wrap: wrap; gap: 10px;
      align-items: center; width: 100%; max-width: 640px;
    }
    button {
      background: transparent; color: var(--accent);
      border: 1px solid var(--accent); padding: 5px 13px;
      cursor: pointer; font-family: monospace; font-size: .82em;
      border-radius: 3px; transition: background .12s; white-space: nowrap;
    }
    button:hover { background: rgba(0,232,122,.1); }
    button.on { background: var(--accent); color: #000; font-weight: bold; }
    label { display: flex; align-items: center; gap: 5px; font-size: .78em; color: #555; }
    label span { color: var(--text); }
    select {
      background: var(--bg); color: var(--text);
      border: 1px solid #2a2a3a; padding: 3px 5px;
      font-family: monospace; font-size: .78em; border-radius: 2px;
    }
    input[type=range] { width: 70px; accent-color: var(--accent); }
    input[type=checkbox] { accent-color: var(--accent); width: 13px; height: 13px; }
    #note-big {
      font-size: 1.3em; color: var(--accent); font-weight: bold;
      min-width: 150px; text-align: center; letter-spacing: .03em;
    }
    #note-editor { display: none; width: 100%; max-width: 640px; }
    #note-editor.open { display: block; }
    .note-editor-hdr {
      background: var(--panel); border: 1px solid #1e1e30;
      border-bottom: none; border-radius: 4px 4px 0 0;
      padding: 5px 12px; font-size: .75em; color: #555;
      display: flex; justify-content: space-between; align-items: center;
    }
    .note-editor-hdr button {
      border: none; padding: 2px 8px; font-size: .78em;
      color: #555; border-color: #333;
    }
    .note-grid {
      background: var(--panel); border: 1px solid #1e1e30;
      border-top: none; border-radius: 0 0 4px 4px;
      padding: 6px;
      display: grid; grid-template-columns: repeat(15, 1fr); gap: 3px;
    }
    .note-cell { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .note-cell .idx { font-size: .58em; color: #333; }
    .note-cell input {
      width: 100%; background: var(--bg); color: var(--accent);
      border: 1px solid #2a2a3a; text-align: center;
      font-family: monospace; font-size: .68em; padding: 3px 1px;
      border-radius: 2px;
    }
    .note-cell input:focus { border-color: var(--accent); outline: none; }
    #status { font-size: .7em; color: #888; text-align: center; }
    body { touch-action: manipulation; user-select: none; }
    @media (max-width: 500px) {
      h1 { font-size: .8em; letter-spacing: .15em; }
      button { padding: 9px 12px; font-size: .9em; }
      select, input[type=range] { font-size: .85em; }
      .note-grid { grid-template-columns: repeat(5, 1fr); }
      #note-big { font-size: 1.1em; min-width: 130px; }
    }
    #video-wrap:fullscreen,
    #video-wrap:-webkit-full-screen {
      width: 100vw !important; max-width: none !important;
      height: 100vh; background: #000;
      display: flex; align-items: center; justify-content: center;
    }
    #video-wrap:fullscreen #overlay,
    #video-wrap:-webkit-full-screen #overlay {
      width: min(100vw, calc(100vh * 4 / 3)) !important;
      height: min(100vh, calc(100vw * 3 / 4)) !important;
    }
  </style>

<body>
  <h1>⚡ SEB-WEBTHEREMINE — ÉCART</h1>

  <div id="video-wrap">
    <video id="videoel" width="640" height="480"></video>

  </div>

  <div class="panel">
    <button id="btn-start">▶ START</button>
    <label><span>Gamme</span>

    <div id="note-big">— · —</div>

  </div>

  <div id="note-editor">
    <div class="note-editor-hdr">
      <span>Notes — nom FR (ex: LA4) ou numéro MIDI</span>
      <button id="btn-regen">↺ Regénérer</button>
    </div>
    <div class="note-grid" id="note-grid"></div>
  </div>

  <div id="status">Chargement du modèle MediaPipe…</div>

<script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>
<script type="module">
(async () => {

// ── SCALES ──────────────────────────────────────────────────────────────────
const SCALES = {
  M:     [0,2,4,5,7,9,11],
  mh:    [0,2,3,5,7,8,11],
  Penta: [0,2,4,7,9],
  Myx:   [0,2,4,5,7,9,10],
  Dor:   [0,2,3,5,7,9,10]
};

const FR = ['DO','DO#','RÉ','RÉ#','MI','FA','FA#','SOL','SOL#','LA','LA#','SI'];

function midiToName(m) {
  if (m < 0 || m > 127) return '?';
  return FR[m % 12] + (Math.floor(m / 12) - 1);
}
function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

function genNotes(root, mode, n = 15) {
  const ivs = SCALES[mode];
  const out = []; let oct = 0, i = 0;
  while (out.length < n) {
    const note = root + oct * 12 + ivs[i % ivs.length];
    if (note <= 127) out.push(note);
    if (++i % ivs.length === 0) oct++;
    if (oct > 6) break;
  }
  return out;
}

function parseFR(s) {
  const n = parseInt(s);
  if (!isNaN(n) && n >= 0 && n <= 127) return n;
  const up = s.trim().toUpperCase();
  const map = [
    ['SOL#',8],['DO#',1],['RÉ#',3],['RE#',3],['FA#',6],['LA#',10],
    ['SOL',7],['DO',0],['RÉ',2],['RE',2],['MI',4],['FA',5],['LA',9],['SI',11]
  ];
  for (const [name, st] of map) {
    if (up.startsWith(name)) {
      const oct = parseInt(up.slice(name.length));
      if (!isNaN(oct) && oct >= -1 && oct <= 9) return (oct + 1) * 12 + st;
    }
  }
  return null;
}

// ── STATE ────────────────────────────────────────────────────────────────────
let notes     = genNotes(60, 'M');
let running   = false;
let mirrored  = true;
const NV = 2; // nombre de voix : une par main
let activeIdx = [-1, -1];
let activeVol = [0, 0];

// ── FILTRE ANTI-NOTES-DE-PASSAGE (une instance par voix) ─────────────────────
// Chaque main a son propre filtre. Une zone ne sonne que si la main y reste
// un certain temps. Ce temps diffère selon la situation, car les deux cas
// n'ont pas le même besoin :
//   • rien ne sonne  → `attaqueMs`, court. On vient du silence, il n'y a
//     aucune note à traverser : l'attaque doit être franche.
//   • une note sonne → `latenceMs`, long. Il faut du temps pour distinguer
//     « je traverse » de « je m'installe ». C'est CE délai qui supprime les
//     notes de passage : do → mi ne fait plus sonner le ré intermédiaire.
//     Pendant la traversée, la note précédente continue (legato, sans trou).
// Quand les mains sont réunies (geste de coupure), on est en silence : ré-
// écarter les mains repasse donc par le délai court (attaque franche).
const OUBLI_MS = 250;
let attaqueMs    = 60;
let latenceMs    = 0;
let pendingIdx   = [-1, -1];
let pendingSince = [0, 0];
let committedIdx = [-1, -1];
let lastVu       = [-1e9, -1e9];

// Renvoie la zone à jouer pour la voix v (0 ou 1), ou -1 si rien n'est encore confirmé.
function resolveIdx(v, rawIdx, now, vol) {
  if (now - lastVu[v] > OUBLI_MS) { pendingIdx[v] = -1; committedIdx[v] = -1; }
  lastVu[v] = now;
  const silencieux = committedIdx[v] < 0 || vol <= 0;
  if (rawIdx !== pendingIdx[v]) { pendingIdx[v] = rawIdx; pendingSince[v] = now; }
  if (now - pendingSince[v] >= (silencieux ? attaqueMs : latenceMs)) committedIdx[v] = rawIdx;
  return committedIdx[v];
}

{
  const ra = document.getElementById('rng-attaque'), la = document.getElementById('lbl-attaque');
  ra.addEventListener('input', e => {
    attaqueMs = parseInt(e.target.value) || 0; la.textContent = attaqueMs + ' ms';
  });
  const rl = document.getElementById('rng-latence'), ll = document.getElementById('lbl-latence');
  rl.addEventListener('input', e => {
    latenceMs = parseInt(e.target.value) || 0; ll.textContent = latenceMs + ' ms';
  });
}


// ── PRESETS SON ──────────────────────────────────────────────────────────────
const PRESETS_SON = {
  theremin: { oscType:'sawtooth', vibratoHz:5.2, vibratoDepth:5, filterQ:2.5, filterBase:900,  attack:0.012, release:0.07,  reverbMix:0.28, octaveShift:0,  stopTime:0.07 },
  martenot: { oscType:'sine',     vibratoHz:4.0, vibratoDepth:2, filterQ:0.7, filterBase:2200, attack:0.06,  release:0.15,  reverbMix:0.45, octaveShift:0,  stopTime:0.07 },
  drone:    { oscType:'sawtooth', vibratoHz:0.5, vibratoDepth:0,   filterQ:3.0, filterBase:280,  attack:2.0,   release:6.0,  reverbMix:0.82, octaveShift:-2, stopTime:0.25 },
  strings:  { oscType:'sawtooth', vibratoHz:5.2, vibratoDepth:3,   filterQ:1.5, filterBase:700,  attack:0.3,   release:0.4,  reverbMix:0.5,  octaveShift:0,  stopTime:0.15 },
  flute:    { oscType:'sine',     vibratoHz:5.0, vibratoDepth:2.5, filterQ:0.4, filterBase:5000, attack:0.04,  release:0.1,  reverbMix:0.32, octaveShift:1,  stopTime:0.07 },
  ocarina: { oscType:'sine',     vibratoHz:4.2, vibratoDepth:1,   filterQ:0.6, filterBase:2800, attack:0.06,  release:0.15, reverbMix:0.28, octaveShift:0,  stopTime:0.08 },
  piano:  { oscType:'triangle', vibratoHz:0, vibratoDepth:0, filterQ:1.2, filterBase:3200, attack:0.005, release:0.8, reverbMix:0.22, octaveShift:0, stopTime:0.22 }
};
let sonMode = 'theremin';

// ── NOTE EDITOR ──────────────────────────────────────────────────────────────
const noteGrid   = document.getElementById('note-grid');
const noteInputs = [];

function buildNoteGrid() {
  noteGrid.innerHTML = '';
  noteInputs.length = 0;
  notes.forEach((midi, i) => {
    const cell = document.createElement('div');
    cell.className = 'note-cell';
    const idx = document.createElement('div');
    idx.className = 'idx';
    idx.textContent = i + 1;
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.value = midiToName(midi);
    inp.addEventListener('change', () => {
      const v = parseFR(inp.value);
      if (v !== null) { notes[i] = v; inp.value = midiToName(v); }
      else inp.value = midiToName(notes[i]);
    });
    noteInputs.push(inp);
    cell.appendChild(idx);
    cell.appendChild(inp);
    noteGrid.appendChild(cell);
  });
}
buildNoteGrid();

const selScale = document.getElementById('sel-scale');
const selRoot  = document.getElementById('sel-root');

function regenFromScale() {
  notes = genNotes(parseInt(selRoot.value), selScale.value);
  buildNoteGrid();
}

document.getElementById('btn-edit').addEventListener('click', () =>
  document.getElementById('note-editor').classList.toggle('open'));
document.getElementById('btn-regen').addEventListener('click', regenFromScale);
selScale.addEventListener('change', regenFromScale);
selRoot.addEventListener('change', regenFromScale);

// ── CAMERA SELECTION ──────────────────────────────────────────────────────────
const selCam = document.getElementById('sel-cam');
let currentStream = null;
let animFrame = null;

async function enumerateCameras() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');
    const prev = selCam.value;
    selCam.innerHTML = '<option value="">Auto</option>';
    cams.forEach((cam, i) => {
      const o = document.createElement('option');
      o.value = cam.deviceId;
      o.textContent = cam.label || `Caméra ${i + 1}`;
      if (cam.deviceId === prev) o.selected = true;
      selCam.appendChild(o);
    });
  } catch (_) {}
}
enumerateCameras();

async function startCamera() {
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
    currentStream = null;
  }
  const constraints = { video: {
    width: { ideal: 640 }, height: { ideal: 480 },
    ...(selCam.value ? { deviceId: { exact: selCam.value } } : {})
  }};
  currentStream = await navigator.mediaDevices.getUserMedia(constraints);
  video.srcObject = currentStream;
  await video.play();
  await enumerateCameras(); // relabels after permission granted
}

function frameLoop() {
  if (!running) return;
  if (video.readyState >= 2 && video.currentTime !== lastT) {
    lastT = video.currentTime;
    drawFrame(hl.detectForVideo(video, performance.now()));
  }
  animFrame = requestAnimationFrame(frameLoop);
}

selCam.addEventListener('change', async () => {
  if (running) {
    cancelAnimationFrame(animFrame);
    await startCamera();
    frameLoop();
  }
});

// ── AUDIO ────────────────────────────────────────────────────────────────────
// Deux mains = deux voix indépendantes. Chaque voix a sa propre chaîne de
// synthèse (oscillateur, vibrato, filtre, enveloppe, réverbération) et son
// propre échantillonneur piano / string ensemble, pour que chaque main sonne
// à sa hauteur et à son volume sans interférer avec l'autre.
// Compensation de niveau : le piano (Salamander) et le string ensemble (FluidR3 GM)
// sont des échantillons enregistrés bien plus bas que les voix synthétisées.
// Facteurs mesurés (RMS d'attaque) pour ramener leur niveau à celui du thérémine.
const GAIN_MAKEUP_PIANO   = 5.01;  // +14 dB
const GAIN_MAKEUP_STRINGS = 14.13; // +23 dB
function dbToGain(db) { return Math.pow(10, db / 20); }

let audioCtx, masterGain, panner, trimGain;
let tremoloLFO, tremoloAmp;
let audioReady = false;

// Tout ce qui suit est indexé par voix (v = 0 ou 1).
const osc = [], vibratoOsc = [], vibratoGain = [], filter = [], envGain = [];
const padOsc = [[], []], padGain = [];
const tremoloMod = [];
const reverb = [], reverbGain = [];

let pianoSampler = [null, null], pianoReady = [false, false], pianoLoading = [null, null], pianoLastPitch = [null, null];
let stringsSampler = [null, null], stringsGain = [null, null], stringsReady = [false, false], stringsLoading = [null, null], stringsLastPitch = [null, null], stringsLastTrigger = [-Infinity, -Infinity];

function makeReverb(ctx) {
  const conv = ctx.createConvolver();
  const sr = ctx.sampleRate, len = sr * 2;
  const buf = ctx.createBuffer(2, len, sr);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++)
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  }
  conv.buffer = buf;
  return conv;
}

function initPiano(v) {
  if (pianoLoading[v]) return pianoLoading[v];
  if (!window.Tone) return Promise.reject(new Error('Tone.js indisponible'));
  window.Tone.setContext(audioCtx);
  pianoLoading[v] = new Promise((resolve, reject) => {
    pianoSampler[v] = new window.Tone.Sampler({
      urls: {
        C4: 'C4.mp3',
        'D#4': 'Ds4.mp3',
        'F#4': 'Fs4.mp3',
        A4: 'A4.mp3'
      },
      baseUrl: 'https://tonejs.github.io/audio/salamander/',
      attack: 0,
      release: 1.5,
      onload: () => {
        pianoReady[v] = true;
        resolve();
      },
      onerror: error => {
        console.error('Chargement du piano impossible', error);
        reject(error);
      }
    }).connect(masterGain);
  });
  return pianoLoading[v];
}

function initStrings(v) {
  if (stringsLoading[v]) return stringsLoading[v];
  if (!window.Tone) return Promise.reject(new Error('Tone.js indisponible'));
  window.Tone.setContext(audioCtx);
  stringsGain[v] = audioCtx.createGain();
  stringsGain[v].gain.value = 0;
  stringsGain[v].connect(masterGain);
  stringsLoading[v] = new Promise((resolve, reject) => {
    stringsSampler[v] = new window.Tone.Sampler({
      urls: {
        C2: 'C2.mp3',
        A2: 'A2.mp3',
        C3: 'C3.mp3',
        A3: 'A3.mp3',
        C4: 'C4.mp3',
        A4: 'A4.mp3',
        C5: 'C5.mp3',
        A5: 'A5.mp3',
        C6: 'C6.mp3'
      },
      baseUrl: './assets/string-ensemble/',
      attack: 0.12,
      release: 1.2,
      onload: () => {
        stringsReady[v] = true;
        resolve();
      },
      onerror: error => {
        console.error('Chargement du String Ensemble impossible', error);
        reject(error);
      }
    }).connect(stringsGain[v]);
  });
  return stringsLoading[v];
}

// Construit la chaîne de synthèse (thérémine/martenot/drone/flûte/ocarina) d'une voix.
function createVoice(v) {
  const p = PRESETS_SON[sonMode];

  osc[v] = audioCtx.createOscillator();
  osc[v].type = p.oscType;
  osc[v].frequency.value = 261.63;

  vibratoOsc[v] = audioCtx.createOscillator();
  vibratoOsc[v].frequency.value = p.vibratoHz;
  vibratoGain[v] = audioCtx.createGain();
  vibratoGain[v].gain.value = p.vibratoDepth;
  vibratoOsc[v].connect(vibratoGain[v]);
  vibratoGain[v].connect(osc[v].frequency);
  vibratoOsc[v].start();

  filter[v] = audioCtx.createBiquadFilter();
  filter[v].type = 'lowpass';
  filter[v].frequency.value = p.filterBase;
  filter[v].Q.value = p.filterQ;

  envGain[v] = audioCtx.createGain();
  envGain[v].gain.value = 0;

  reverb[v] = makeReverb(audioCtx);
  reverbGain[v] = audioCtx.createGain();
  reverbGain[v].gain.value = p.reverbMix;

  const o1 = audioCtx.createOscillator(), o2 = audioCtx.createOscillator();
  const o3 = audioCtx.createOscillator(), o4 = audioCtx.createOscillator();
  padGain[v] = audioCtx.createGain();
  [o1, o2, o3, o4].forEach(o => { o.type = 'sawtooth'; o.connect(padGain[v]); o.start(); });
  o1.detune.value = -20; o2.detune.value = +20;
  o3.detune.value = -45; o4.detune.value = +45;
  padOsc[v] = [o1, o2, o3, o4];
  padGain[v].gain.value = sonMode === 'drone' ? 0.3 : sonMode === 'strings' ? 0.45 : 0;

  tremoloMod[v] = audioCtx.createGain();
  tremoloMod[v].gain.value = sonMode === 'drone' ? 0.88 : 1;
  tremoloAmp.connect(tremoloMod[v].gain);

  osc[v].connect(filter[v]);
  padGain[v].connect(filter[v]);
  filter[v].connect(tremoloMod[v]);
  tremoloMod[v].connect(envGain[v]);
  envGain[v].connect(masterGain);
  envGain[v].connect(reverb[v]);
  reverb[v].connect(reverbGain[v]);
  reverbGain[v].connect(masterGain);

  osc[v].start();
}

async function initAudio() {
  if (audioReady) return;
  audioReady = true;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();

  masterGain = audioCtx.createGain();
  masterGain.gain.value = parseFloat(document.getElementById('rng-vol').value);

  tremoloLFO = audioCtx.createOscillator();
  tremoloLFO.type = 'sine'; tremoloLFO.frequency.value = 5.0;
  tremoloAmp = audioCtx.createGain();
  tremoloAmp.gain.value = sonMode === 'drone' ? 0.12 : 0;
  tremoloLFO.connect(tremoloAmp);
  tremoloLFO.start();

  createVoice(0);
  createVoice(1);

  panner = audioCtx.createStereoPanner();
  panner.pan.value = parseFloat(document.getElementById('rng-pan').value) || 0;
  trimGain = audioCtx.createGain();
  trimGain.gain.value = dbToGain(parseFloat(document.getElementById('rng-gain').value));
  masterGain.connect(trimGain);
  trimGain.connect(panner);
  panner.connect(audioCtx.destination);

  const pianoPromise = Promise.all([initPiano(0), initPiano(1)]).catch(error => {
    console.error('Piano Salamander indisponible', error);
  });
  if (sonMode === 'piano') await pianoPromise;
  const stringsPromise = Promise.all([initStrings(0), initStrings(1)]).catch(error => {
    console.error('String Ensemble FluidR3 GM indisponible', error);
  });
  if (sonMode === 'strings') await stringsPromise;
}

document.getElementById('rng-vol').addEventListener('input', e => {
  if (masterGain)
    masterGain.gain.setTargetAtTime(+e.target.value, audioCtx.currentTime, 0.05);
});

document.getElementById('rng-pan').addEventListener('input', e => {
  if (panner) panner.pan.setTargetAtTime(+e.target.value, audioCtx.currentTime, 0.05);
});

document.getElementById('rng-gain').addEventListener('input', e => {
  const db = parseFloat(e.target.value);
  document.getElementById('lbl-gain').textContent = (db > 0 ? '+' : '') + db.toFixed(1) + ' dB';
  if (trimGain) trimGain.gain.setTargetAtTime(dbToGain(db), audioCtx.currentTime, 0.05);
});

const selOut = document.getElementById('sel-out');
async function enumerateOutputs() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const outs = devices.filter(d => d.kind === 'audiooutput');
    const prev = selOut.value;
    selOut.innerHTML = '<option value="">Défaut</option>';
    outs.forEach((out, i) => {
      const o = document.createElement('option');
      o.value = out.deviceId;
      o.textContent = out.label || `Sortie ${i+1}`;
      if (out.deviceId === prev) o.selected = true;
      selOut.appendChild(o);
    });
    if (!AudioContext.prototype.setSinkId) { selOut.disabled = true; selOut.title = 'Non supporté sur Safari'; }
  } catch(_) {}
}
enumerateOutputs();
selOut.addEventListener('change', async () => {
  if (!audioCtx?.setSinkId) return;
  try { await audioCtx.setSinkId(selOut.value || ''); } catch(_) {}
});

// Joue/coupe la voix v (0 ou 1) sur la note idx (ou -1 pour le silence) au volume vol.
function playVoice(v, idx, vol) {
  if (!audioCtx || !running) return;
  if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') audioCtx.resume();
  const p = PRESETS_SON[sonMode];
  if (idx >= 0 && vol > 0.02) {
    const freq = midiToFreq(notes[idx]) * Math.pow(2, p.octaveShift);
    if (sonMode === 'piano') {
      envGain[v].gain.setTargetAtTime(0, audioCtx.currentTime, 0.01);
      if (stringsGain[v]) stringsGain[v].gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
      if (stringsReady[v] && stringsLastPitch[v] !== null) stringsSampler[v].triggerRelease(stringsLastPitch[v]);
      stringsLastPitch[v] = null;
      stringsLastTrigger[v] = -Infinity;
      if (pianoReady[v] && freq !== pianoLastPitch[v]) {
        pianoSampler[v].triggerAttackRelease(freq, 1.2, undefined, Math.max(0.15, vol) * GAIN_MAKEUP_PIANO);
        pianoLastPitch[v] = freq;
      }
      activeIdx[v] = idx;
      activeVol[v] = vol;
      return;
    }
    if (sonMode === 'strings') {
      envGain[v].gain.setTargetAtTime(0, audioCtx.currentTime, 0.01);
      if (pianoReady[v] && pianoLastPitch[v] !== null) pianoSampler[v].triggerRelease(pianoLastPitch[v]);
      pianoLastPitch[v] = null;
      stringsGain[v].gain.setTargetAtTime(Math.max(0, Math.min(1, vol)) * 0.85 * GAIN_MAKEUP_STRINGS, audioCtx.currentTime, 0.12);
      const now = audioCtx.currentTime;
      if (stringsReady[v] && (freq !== stringsLastPitch[v] || now - stringsLastTrigger[v] > 2.9)) {
        if (stringsLastPitch[v] !== null && stringsLastPitch[v] !== freq) stringsSampler[v].triggerRelease(stringsLastPitch[v]);
        stringsSampler[v].triggerAttack(freq, undefined, 0.8);
        stringsLastPitch[v] = freq;
        stringsLastTrigger[v] = now;
      }
      activeIdx[v] = idx;
      activeVol[v] = vol;
      return;
    }
    if (stringsGain[v]) stringsGain[v].gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
    if (stringsReady[v] && stringsLastPitch[v] !== null) stringsSampler[v].triggerRelease(stringsLastPitch[v]);
    stringsLastPitch[v] = null;
    stringsLastTrigger[v] = -Infinity;
    if (pianoReady[v] && pianoLastPitch[v] !== null) pianoSampler[v].triggerRelease(pianoLastPitch[v]);
    pianoLastPitch[v] = null;
    osc[v].frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.03);
    if (sonMode === 'drone' || sonMode === 'strings') {
      padOsc[v].forEach(o => o.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.05));
    }
    filter[v].frequency.setTargetAtTime(p.filterBase + vol * 2000, audioCtx.currentTime, 0.03);
    envGain[v].gain.setTargetAtTime(vol * 0.7, audioCtx.currentTime, p.attack);
    reverbGain[v].gain.setTargetAtTime(p.reverbMix, audioCtx.currentTime, 0.05);
    activeIdx[v] = idx;
    activeVol[v] = vol;
  } else {
    if (sonMode === 'piano') {
      if (pianoReady[v] && pianoLastPitch[v] !== null) pianoSampler[v].triggerRelease(pianoLastPitch[v]);
      pianoLastPitch[v] = null;
      activeIdx[v] = -1;
      activeVol[v] = 0;
      return;
    }
    if (sonMode === 'strings') {
      if (stringsGain[v]) stringsGain[v].gain.setTargetAtTime(0, audioCtx.currentTime, 0.15);
      if (stringsReady[v] && stringsLastPitch[v] !== null) stringsSampler[v].triggerRelease(stringsLastPitch[v]);
      stringsLastPitch[v] = null;
      stringsLastTrigger[v] = -Infinity;
      activeIdx[v] = -1;
      activeVol[v] = 0;
      return;
    }
    envGain[v].gain.setTargetAtTime(0, audioCtx.currentTime, p.stopTime);
    reverbGain[v].gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
    activeIdx[v] = -1;
    activeVol[v] = 0;
  }
}

// ── MEDIAPIPE ────────────────────────────────────────────────────────────────
const video   = document.getElementById('videoel');
const overlay = document.getElementById('overlay');
const ctx2d   = overlay.getContext('2d');

const vision = await import(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs"
);
const { HandLandmarker, FilesetResolver, DrawingUtils } = vision;
const dwUtils = new DrawingUtils(ctx2d);

const fs = await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm"
);
const hl = await HandLandmarker.createFromOptions(fs, {
  baseOptions: {
    modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
    delegate: 'GPU'
  },
  runningMode: 'VIDEO',
  numHands: 2
});

document.getElementById('status').textContent =
  'Sébastien Gay - septembre 2026';

// ── DRAW ─────────────────────────────────────────────────────────────────────
// Geste : les DEUX mains sont suivies en permanence, et chacune pilote SA
// PROPRE voix (note = sa position horizontale, volume = sa hauteur) — vert
// pour la main la plus à gauche à l'écran, bleu pour l'autre. L'écart entre
// les deux mains reste l'interrupteur commun : mains réunies → silence des
// deux voix, mains écartées → chaque main sonne sa propre note.
const COULEUR_VOIX = ['#00e87a', '#3fa9ff'];

function drawFrame(res) {
  const W = overlay.width, H = overlay.height;
  const N = notes.length;
  const zW = W / N;
  const scale = W / (overlay.offsetWidth || W);

  ctx2d.clearRect(0, 0, W, H);

  // Draw video (mirrored if needed)
  ctx2d.save();
  if (mirrored) { ctx2d.translate(W, 0); ctx2d.scale(-1, 1); }
  ctx2d.drawImage(video, 0, 0, W, H);
  ctx2d.restore();

  // Note zone bands
  for (let i = 0; i < N; i++) {
    const x = i * zW;
    const aActive = i === activeIdx[0];
    const bActive = i === activeIdx[1];
    ctx2d.fillStyle = 'rgba(255,255,255,0.025)';
    ctx2d.fillRect(x, 0, zW - 1, H);
    if (aActive) {
      const bH = activeVol[0] * H;
      ctx2d.fillStyle = 'rgba(0,232,122,0.25)';
      ctx2d.fillRect(x, H - bH, zW - 1, bH);
    }
    if (bActive) {
      const bH = activeVol[1] * H;
      ctx2d.fillStyle = 'rgba(63,169,255,0.25)';
      ctx2d.fillRect(x, H - bH, zW - 1, bH);
    }
    const active = aActive || bActive;
    const bandColor = aActive && bActive ? '#ffffff' : aActive ? COULEUR_VOIX[0] : bActive ? COULEUR_VOIX[1] : '#252530';
    ctx2d.strokeStyle = bandColor;
    ctx2d.lineWidth = active ? 2 : 1;
    ctx2d.beginPath(); ctx2d.moveTo(x, 0); ctx2d.lineTo(x, H); ctx2d.stroke();
    ctx2d.fillStyle = active ? bandColor : '#2e2e44';
    const fsz = Math.round(10 * scale);
    ctx2d.font = active ? `bold ${fsz + 1}px monospace` : `${fsz}px monospace`;
    ctx2d.textAlign = 'center';
    ctx2d.fillText(midiToName(notes[i]), x + zW / 2, fsz + 4);
  }

  // Mains & geste d'écart
  let controlled = false;
  const r = zW / 2;
  const GATE_DIST = r * 3; // distance (px écran) au-delà de laquelle les mains sont « écartées »

  if (res.landmarks && res.landmarks.length >= 2) {
    controlled = true;

    // Voix A = main la plus à gauche à l'écran, voix B = la plus à droite
    // (identité stable frame à frame, indépendante de l'ordre de détection MediaPipe).
    const pts = res.landmarks.slice(0, 2).map(lm => {
      const cx = lm.reduce((s, pt) => s + pt.x, 0) / lm.length;
      const cy = lm.reduce((s, pt) => s + pt.y, 0) / lm.length;
      const sx = mirrored ? 1 - cx : cx;
      return { x: sx * W, y: cy * H };
    }).sort((a, b) => a.x - b.x);

    const [p1, p2] = pts;
    const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
    const ecartees = dist > GATE_DIST;

    const noms = ['—', '—'];
    for (let v = 0; v < 2; v++) {
      const p = pts[v];
      const rawIdx = Math.min(N - 1, Math.floor((p.x / W) * N));
      const volBrut = Math.max(0, Math.min(1, 1 - (p.y / H) * 1.35));

      let idx, vol;
      if (ecartees) {
        vol = volBrut;
        idx = resolveIdx(v, rawIdx, performance.now(), vol);
      } else {
        // Geste fermé (mains réunies) : silence immédiat pour les deux voix.
        // On réarme aussi le filtre pour que la réouverture reparte par le
        // délai court (`attaqueMs`) plutôt que de reprendre l'ancienne note.
        pendingIdx[v] = -1; committedIdx[v] = -1; lastVu[v] = performance.now();
        vol = 0;
        idx = -1;
      }

      playVoice(v, idx, vol);
      noms[v] = idx >= 0 ? midiToName(notes[idx]) : '—';
    }
    document.getElementById('note-big').innerHTML =
      `<span style="color:${COULEUR_VOIX[0]}">${noms[0]}</span>` +
      ` <span style="color:#444">·</span> ` +
      `<span style="color:${COULEUR_VOIX[1]}">${noms[1]}</span>`;

    // Ligne entre les deux mains : verte si écartées (ça joue), orange si réunies (silence)
    ctx2d.beginPath();
    ctx2d.moveTo(p1.x, p1.y); ctx2d.lineTo(p2.x, p2.y);
    ctx2d.strokeStyle = ecartees ? 'rgba(0,232,122,0.6)' : 'rgba(255,102,51,0.5)';
    ctx2d.lineWidth = 2;
    ctx2d.stroke();

    // Pastilles (couleur = identité de la voix) et barre de volume individuelle
    pts.forEach((p, v) => {
      ctx2d.beginPath();
      ctx2d.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx2d.globalAlpha = ecartees ? 0.85 : 0.35;
      ctx2d.fillStyle = COULEUR_VOIX[v];
      ctx2d.fill();
      ctx2d.globalAlpha = 1;

      const vol = activeVol[v];
      const bH = vol * H * 0.85;
      const bx = v === 0 ? W - 20 : W - 10;
      ctx2d.globalAlpha = 0.2 + vol * 0.5;
      ctx2d.fillStyle = COULEUR_VOIX[v];
      ctx2d.fillRect(bx, H - bH, 8, bH);
      ctx2d.globalAlpha = 1;
    });
  }

  if (!controlled && running) {
    playVoice(0, -1, 0);
    playVoice(1, -1, 0);
    document.getElementById('note-big').textContent = '— · —';
  }
}

// ── START / STOP ──────────────────────────────────────────────────────────────
const btnStart = document.getElementById('btn-start');
let lastT = -1;

btnStart.addEventListener('click', async () => {
  if (!running) {
    await initAudio();
    await startCamera();
    running = true;
    frameLoop();
    btnStart.textContent = '⏹ STOP';
    btnStart.classList.add('on');
    document.getElementById('status').textContent = '';
  } else {
    running = false;
    cancelAnimationFrame(animFrame);
    animFrame = null;
    playVoice(0, -1, 0);
    playVoice(1, -1, 0);
    if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
    video.srcObject = null;
    btnStart.textContent = '▶ START';
    btnStart.classList.remove('on');
    ctx2d.clearRect(0, 0, overlay.width, overlay.height);
    document.getElementById('note-big').textContent = '— · —';
    document.getElementById('status').textContent = 'Arrêté';
  }
});

// ── CHOIX DU SON ─────────────────────────────────────────────────────────────
document.getElementById('sel-son').addEventListener('change', e => {
  sonMode = e.target.value;
  if (!audioCtx) return;
  const p = PRESETS_SON[sonMode];
  const isDrone = sonMode === 'drone';
  const isStrings = sonMode === 'strings';
  for (let v = 0; v < NV; v++) {
    osc[v].type = p.oscType;
    vibratoOsc[v].frequency.setTargetAtTime(p.vibratoHz, audioCtx.currentTime, 0.5);
    vibratoGain[v].gain.setTargetAtTime(p.vibratoDepth, audioCtx.currentTime, 0.5);
    filter[v].Q.setTargetAtTime(p.filterQ, audioCtx.currentTime, 0.5);
    reverbGain[v].gain.setTargetAtTime(p.reverbMix, audioCtx.currentTime, 0.5);
    if (isDrone) {
      padOsc[v][0].detune.value = -20; padOsc[v][1].detune.value = 20;
      padOsc[v][2].detune.value = -45; padOsc[v][3].detune.value = 45;
      padGain[v].gain.setTargetAtTime(0.3, audioCtx.currentTime, 0.5);
    } else if (isStrings) {
      padOsc[v][0].detune.value = -8;  padOsc[v][1].detune.value = 8;
      padOsc[v][2].detune.value = -18; padOsc[v][3].detune.value = 18;
      padGain[v].gain.setTargetAtTime(0.45, audioCtx.currentTime, 0.5);
    } else {
      padGain[v].gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
    }
    tremoloMod[v].gain.setTargetAtTime(isDrone ? 0.88 : 1, audioCtx.currentTime, 0.3);
  }
  tremoloAmp.gain.setTargetAtTime(isDrone ? 0.12 : 0, audioCtx.currentTime, 0.3);
});

const videoWrap = document.getElementById('video-wrap');
btnFs.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    videoWrap.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
});
document.addEventListener('fullscreenchange', () => {
  btnFs.textContent = document.fullscreenElement ? '⊡' : '⛶';
  btnFs.title = document.fullscreenElement ? 'Quitter plein écran' : 'Plein écran';
});

})();
